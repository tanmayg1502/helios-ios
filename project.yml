name: Helios
configs:
  Debug: debug
  Release: release
  TestFlight: release
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  configs:
    TestFlight:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTFLIGHT_DEVELOPER_TOOLS"
  base:
    SWIFT_VERSION: '6.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.pranav.helios
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Helios:
    type: application
    platform: iOS
    sources: [Helios]
    info:
      path: Helios/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Connect to your Helios robot gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Helios
  HeliosTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HeliosTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.helios.tests
    dependencies:
      - target: Helios
  HeliosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HeliosUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.helios.uitests
    dependencies:
      - target: Helios
schemes:
  Helios:
    build:
      targets:
        Helios: all
    test:
      targets: [HeliosTests]
  HeliosIntegration:
    build:
      targets:
        Helios: all
    test:
      targets: [HeliosUITests]
  HeliosTestFlight:
    build:
      targets:
        Helios: all
    run:
      config: TestFlight
    archive:
      config: TestFlight
